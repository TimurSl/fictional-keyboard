plugins {
    id 'com.android.application'
}

// Release signing comes from env vars (set by CI from repository secrets).
// When they are missing the release build is simply left unsigned.
def ksFile = System.getenv('KEYSTORE_FILE')
def ksPass = System.getenv('KEYSTORE_PASSWORD')
def ksAlias = System.getenv('KEY_ALIAS')
def keyPass = System.getenv('KEY_PASSWORD')
def canSign = ksFile && ksPass && ksAlias && keyPass && file(ksFile).exists()

android {
    namespace 'com.enchanting.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.enchanting.keyboard'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        if (canSign) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
